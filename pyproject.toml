[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project]
name = "notebook-frontend"
version = "7.6.1.post0"
description = "A Python package distributing Notebook's static assets"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Typing :: Typed", "Programming Language :: Python", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14",]
dependencies = [ "jupyterlab-js==4.6.1",]
[[project.authors]]
name = "David Brochart"
email = "david.brochart@gmail.com"

[project.license]
file = "LICENSE"

[project.urls]
Source = "https://github.com/davidbrochart/notebook-frontend"

[tool.hatch.build.targets.sdist]
include = [ "src/notebook_frontend", "share",]

[tool.hatch.build.targets.wheel]
ignore-vcs = true
packages = [ "src/notebook_frontend",]
artifacts = [ "src/notebook_frontend/static", "src/notebook_frontend/templates",]

[tool.hatch.build.targets.wheel.shared-data]
"share/jupyter" = "share/jupyter"
